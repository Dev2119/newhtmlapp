<!DOCTYPE html>
<html>
<head>
  <title>Driver Setup</title>
  <style>
       body{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
  font-weight: 100;
  font-style: normal;
}
    .progress-container {
      width: 100%;
      background: #eee;
      height: 10px;
      border-radius: 5px;
    }
    .progress-bar {
      width: 0%;
      height: 10px;
      background: #2563eb;
      transition: width 1.5s linear;
    }
    .red { color: red; font-weight: bold; }
.dr-container {
    display: flex;
    align-items: self-start;
    justify-content: space-between;
    width: 65%;
    margin: 150px auto 0;
    height: 100vh;
}
.header {
    background: #dff1ff;
    padding: 18px 30px;
}
.header-container {
  max-width: 1200px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Logo */
.logo img {
  height: 45px;
}

/* Navigation */
.nav {
  display: flex;
  gap: 30px;
}

.nav a {
  text-decoration: none;
  font-size: 16px;
  font-weight: 600;
  color: #000;
  letter-spacing: 0.5px;
}

.nav a:hover {
  color: #0056ff;
}

/* Contact Button */
.btn {
  text-decoration: none;
  padding: 10px 22px;
  border: 2px solid #0056ff;
  color: #0056ff;
  border-radius: 12px;
  font-weight: 700;
  transition: all 0.3s ease;
}

.btn:hover {
  background: #0056ff;
  color: #fff;
}
.footer {
  width: 100%;
  background: #000;
  padding: 18px 0;
  text-align: center;
}

.footer p {
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 0;
  margin: 0;
}
  </style>
</head>
<body>
  <header class="header">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <img src="./img/l.jpg" alt="Printer Logo">
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <a href="#">OFFICEJET</a>
      <a href="#">LASERJET</a>
      <a href="#">PIXMA</a>
      <a href="#">MAXIFY</a>
      <a href="#">XP SERIES</a>
    </nav>

    <!-- CTA Button -->
    <div class="cta">
      <a href="#" class="btn">CONTACT US</a>
    </div>

  </div>
</header>

  <div class="dr-container">
    <div class="hp-text">
      <h1>
     Driver Loading
      </h1>
    </div>
    <div class="loaderWrap">
      <div id="loadingBox">
  <h3>Processing HP Printer…</h3>
  <div class="progress-container">
  <div class="progress-bar" id="progressBar"></div>
    <div id="stepContent"></div>
</div>

</div>

    </div>
    <div class="hp-image">
      <img src="./img/gif.gif" alt="Printer Setup" />
    </div>
  </div>
<footer class="footer">
  <p>Copyright © 2026 by Official Printer Support</p>
</footer>
<script>
const steps = [
  `<p>Detecting connection…</p>`,
  `<p>Checking requirements…</p>`,
  `<p>Preparing install…</p>`,
  `<p>Installing software…</p>`,
  `<p class="red">Required file(s) not found</p>`
];

const progressBar = document.getElementById("progressBar");
let currentStep = 0;
const stepPercent = 100 / steps.length;

function runProgress() {
  if (currentStep < steps.length) {
    progressBar.style.width = `${stepPercent * (currentStep + 1)}%`;
    document.getElementById("stepContent").innerHTML = steps[currentStep];
    currentStep++;
    setTimeout(runProgress, 2000);
  } else {
    setTimeout(() => {
      window.location.href = "/driver-error.html";
    }, 2000);
  }
}

runProgress();
</script>

</body>
</html>
